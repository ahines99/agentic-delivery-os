name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.18"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --no-sync python -m ruff check .
      - name: Check formatting
        run: uv run --no-sync python -m ruff format --check .
      - name: Type check
        run: uv run --no-sync python -m mypy
      - name: Test
        run: uv run --no-sync python -m pytest
      - name: Build distributable package
        run: uv build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Scan committed changes
        run: >-
          docker run --rm --network none --volume "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          git /repo --redact --no-banner

  integration:
    name: PostgreSQL, Temporal, Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: delivery
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: delivery
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U delivery -d delivery"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://delivery:ci-local-only@127.0.0.1:5432/delivery
      TEST_CAMPAIGN_ALLOCATION_POSTGRES_URL: postgresql+psycopg://delivery:ci-local-only@127.0.0.1:5432/delivery_eval_allocation_ci
      TEST_TEMPORAL_ADDRESS: 127.0.0.1:7233
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.18"
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --extra dev
      - name: Provision isolated campaign allocation database
        run: |
          uv run --no-sync python - <<'PY'
          import psycopg
          with psycopg.connect(
              host="127.0.0.1", port=5432, dbname="delivery",
              user="delivery", password="ci-local-only", autocommit=True,
          ) as connection:
              connection.execute("CREATE DATABASE delivery_eval_allocation_ci")
          PY
      - name: Start Temporal development server
        run: >-
          docker run --detach --name delivery-temporal -p 127.0.0.1:7233:7233
          temporalio/temporal:1.9.1@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e
          server start-dev --ip 0.0.0.0 --headless
      - name: Build fixed sandbox image
        run: |
          docker build -t delivery-sandbox:ci -f infra/docker/sandbox.Dockerfile infra/docker
          echo "TEST_SANDBOX_IMAGE=$(docker image inspect delivery-sandbox:ci --format '{{.Id}}')" >> "$GITHUB_ENV"
          echo "TEST_SRC_SANDBOX_IMAGE=$(docker image inspect delivery-sandbox:ci --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Test real service boundaries
        run: uv run --no-sync python -m pytest -m integration -q
      - name: Remove Temporal development container
        if: always()
        run: docker rm -f delivery-temporal || true
      - name: Remove isolated campaign allocation database
        if: always()
        run: |
          uv run --no-sync python - <<'PY'
          import psycopg
          with psycopg.connect(
              host="127.0.0.1", port=5432, dbname="delivery",
              user="delivery", password="ci-local-only", autocommit=True,
          ) as connection:
              connection.execute("DROP DATABASE IF EXISTS delivery_eval_allocation_ci WITH (FORCE)")
          PY
